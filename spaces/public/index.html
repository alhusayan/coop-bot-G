<!doctype html>
<html lang="en" dir="ltr" data-space-scene>
<head>
<script src="/findzia/boot.js"></script><script src="/spaces-theme.js"></script><script src="/mobile-viewport.js" defer></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f2"><meta name="description" content="Any space. Three new possibilities. Find the pieces you love with Findzia Spaces."><title>Findzia Spaces — Design &amp; Shop. All in One Place.</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css?v=20261016-guide1"><link rel="stylesheet" href="/findzia/original.css"><link rel="stylesheet" href="/findzia/fonts.css"><link rel="stylesheet" href="/findzia/motion.css"><link rel="stylesheet" href="/findzia-shell.css"><link rel="stylesheet" href="/spaces-typography.css"><link rel="stylesheet" href="/design-studio.css?v=20261016-guide1"><link rel="stylesheet" href="/space-scene.css?v=20261017-scene1"><script type="module" src="/app.js?v=20261017-scene1"></script>
</head>
<body>
<div id="shopify-section-spaces"><section class="fz-home" id="findzia-home-spaces" data-lang="en" dir="ltr" data-home-state="empty" data-theme="light"><div class="fz-dark-home" data-dark-home><header class="fz-dark-header">
<button class="fz-dark-round" type="button" disabled data-shell-pending data-dark-menu-open aria-label="Menu" aria-haspopup="dialog" aria-controls="fz-dark-menu-spaces" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 6h14M5 12h10M5 18h14"/></svg></button>
<a href="#" data-home-link class="fz-brand" aria-label="Findzia — Shop a brighter you"><div class="fz-brand-name" aria-hidden="true">Findz<span class="fz-brand-i">ı</span>a</div><span class="fz-brand-tagline" aria-hidden="true">SHOP A BRIGHTER YOU</span></a>
<div class="fz-dark-header-actions">
<button class="fz-dark-round fz-dark-market" type="button" disabled data-shell-pending data-dark-market-open data-no-i18n aria-haspopup="dialog" aria-controls="sheet" aria-label="Market, language and currency"><span data-dark-market-flag aria-hidden="true">🇸🇦</span></button>
<button class="fz-dark-round" type="button" disabled data-shell-pending data-dark-settings aria-label="Settings" aria-haspopup="dialog" aria-controls="fz-preferences-spaces"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20v-2a6.5 6.5 0 0 1 13 0v2Z"/></svg></button>
</div>
</header></div><dialog class="fz-dark-menu" id="fz-dark-menu-spaces" data-dark-menu aria-label="Menu"><div class="fz-dark-menu-head"><h2>Menu</h2><button class="fz-dark-menu-close" data-dark-menu-close aria-label="Close">×</button></div></dialog>
<div hidden><select data-profile-market-select aria-label="Market"></select><select data-profile-language-select aria-label="Language"></select><select data-solar-mode aria-label="Appearance"><option value="auto">Automatic</option><option value="light">Light</option><option value="dark">Dark</option></select></div></section></div>
<main data-spaces-content>
<section class="view space-scene" id="home" aria-label="Start a new room">
 <img class="scene-cover" src="/space-cover.webp" alt="" fetchpriority="high" width="1254" height="1254">
 <div class="scene-shade"></div>
 <div class="scene-bottom" id="drop-zone">
  <h1 data-scene="title" data-no-i18n>Design your space.</h1>
  <button class="scene-primary" data-action="add-photo" disabled><span class="icon" data-icon="plus"></span><span data-scene="add" data-no-i18n>Add a photo</span></button>
  <button class="scene-link" data-action="demo" disabled><span data-scene="example" data-no-i18n>Try an example</span></button>
  <p id="auth-notice" class="notice hidden" role="status"></p><button id="retry-access" class="scene-link hidden">Try again</button>
 </div>
</section>
<section class="view space-scene hidden" id="setup" aria-label="Room preferences">
 <div class="scene-media"><img id="upload-preview" alt="Your room"></div><div class="scene-shade"></div>
 <button class="scene-float scene-top-start" data-action="add-photo" aria-label="Change photo"><span class="icon" data-icon="camera"></span></button>
 <form id="design-form" class="scene-bottom"><input type="hidden" name="room" value="auto">
  <div class="scene-create-row"><button class="scene-float scene-options" type="button" data-action="options" aria-label="Design options"><span class="icon" data-icon="options"></span></button><button class="scene-primary" id="generate-button" type="submit"><span id="discover-label" data-scene="create" data-no-i18n>Create designs</span><span class="icon" data-icon="spark"></span></button></div>
  <p class="scene-cost" data-scene="cost" data-no-i18n>3 designs · 3 credits</p>
 </form>
</section>
<section class="view space-scene hidden" id="designs" aria-label="Choose a design">
 <button class="scene-float scene-top-end" data-action="original" aria-label="Your photo" title="Your photo"><span class="icon" data-icon="compare"></span><img id="original-thumb" alt="Your original room" hidden></button>
 <p id="generation-status" class="scene-sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
 <div id="design-studio" hidden></div><div id="design-grid" class="scene-gallery"></div>
 <nav class="design-gallery-nav scene-gallery-nav" id="design-gallery-nav" aria-label="Choose a design" hidden></nav>
</section>
<section class="view space-scene hidden" id="shopping" aria-label="Shop your design">
 <h1 id="selected-title" class="scene-sr-only">Your room</h1>
 <button class="scene-float scene-top-start" data-action="designs" aria-label="All designs" title="All designs"><span class="icon" data-icon="back"></span></button>
 <div class="shopping-layout"><div class="room-stage">
  <div class="scene-pick-media"><div class="design-canvas" id="design-canvas"><img id="selected-image" alt="Selected room design"><div id="hotspots"></div><button class="compare-button" data-action="compare" aria-pressed="false"><span class="icon small" data-icon="compare"></span><span id="compare-label">Before</span></button></div></div>
  <div class="scene-pick-bottom"><p class="stage-hint"></p><div id="piece-feedback" aria-live="polite"></div><div id="empty-items" class="empty-items hidden"></div></div>
 </div><section id="design-picks" class="design-picks" aria-label="Your design picks" hidden></section><div class="shop-panel" hidden><div class="shop-heading" hidden><h2>Shop the room</h2><span id="shop-count" role="status"></span></div><div id="search-progress" class="search-progress hidden"><span class="pulse-dot"></span><div><span id="search-status" role="status">Finding the pieces…</span><span id="search-detail"></span></div><div class="search-track" aria-hidden="true"><span id="search-track-fill"></span></div></div><div id="items-list" class="items-grid" hidden></div><button id="summary-button" class="summary-button hidden" data-action="summary"><span>Your shopping list</span><span id="summary-total"></span><span class="icon small" data-icon="forward"></span></button></div></div>
</section>
<section class="view hidden" id="history" aria-label="My rooms"><button class="back" data-action="home"><span class="icon" data-icon="back"></span>Back</button><div class="page-heading"><h1>Your designs.</h1></div><div id="history-list" class="history-grid"></div></section>
</main>
<dialog id="space-options" class="scene-sheet" aria-label="Design options">
 <div class="scene-sheet-head"><h2 data-scene="options" data-no-i18n>Options</h2><button class="scene-float" data-action="options-done" aria-label="Done"><span class="icon" data-icon="check"></span></button></div>
 <fieldset><legend>How much would you change?</legend><div class="scene-scope"><label><input form="design-form" type="radio" name="scope" value="decor"><span>Furniture &amp; decor</span></label><label><input form="design-form" type="radio" name="scope" value="full" checked><span>Full refresh</span></label><label><input form="design-form" type="radio" name="scope" value="scratch"><span>From scratch</span></label></div></fieldset>
 <label for="design-request">Your style or wishes</label><textarea form="design-form" id="design-request" name="request" maxlength="600" rows="2" placeholder="e.g. Warm colours, easy to clean"></textarea>
 <button type="button" class="scene-primary" data-action="options-done"><span data-scene="done" data-no-i18n>Done</span></button>
</dialog>
<div hidden><button data-action="upload" disabled aria-label="Choose a photo"></button><button data-action="camera" disabled aria-label="Take a photo"></button></div>
<footer><span>findzia spaces</span><span>Made for your space.</span></footer>
<input type="file" id="file-input" accept="image/*" hidden><input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
<dialog id="sheet" aria-label="Room details"><div class="sheet-handle" aria-hidden="true"></div><button class="round sheet-close" data-action="close" aria-label="Done"><span class="icon" data-icon="check"></span></button><div id="sheet-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
